# Builds all three parts of the link and, from a tag, attaches them to a release.
#
# This is the replacement for `yak push`: a tagged release carrying the .gha, the .rhp and the .vsix, which anybody can
# download without a package source, a token or an account. Yak packing stays a local script because it needs
# Yak.exe, which ships inside Rhino and is not on a runner.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows, because the plugin targets net7.0 against the Grasshopper reference assemblies and that is where
    # the .gha is normally produced. Nothing here needs Rhino installed - the NuGet package supplies the
    # references - but keeping the build on the platform it ships to costs nothing and removes a question.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # One SDK, not two. The plugin targets net7.0 but is never *run* here - only built - and a modern SDK
      # builds an old target by fetching its reference pack from NuGet, a few megabytes against the 288 MB
      # of a second SDK and the minute it took to unpack.
      #
      # The kernel's workflow keeps both on purpose: it runs tests on net7.0, and running needs a runtime
      # that no reference pack provides.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The plugin references no Phenome library on purpose, so this builds from a clean clone with no feed
      # and no secret. That property is worth a comment because it is the reason this repository is public.
      - name: Build the plugin
        run: dotnet build src/Phenome.Apps.GrasshopperLink/Phenome.Apps.GrasshopperLink.csproj -c Release

      # The Rhino half, which is the one a release forgets: everything works without it until Rhino stops
      # on a dialog before Grasshopper has loaded, and then nothing is listening to say so. v0.21.0 shipped
      # without it because this file builds what it names and it named only the plugin above.
      - name: Build the Rhino plugin
        run: dotnet build src/Phenome.Apps.RhinoLink/Phenome.Apps.RhinoLink.csproj -c Release

      # Pinned. `npx --yes @vscode/vsce` takes whatever is newest at the moment the build runs, and vsce
      # carries thirty direct dependencies - so an upstream release could change what lands in our .vsix
      # without any commit here, and nothing would record which version packed a given release.
      #
      # The npm deprecation warnings in this step's log come from that tree, not from us: this extension has
      # no dependencies at all, deliberately. They are left visible rather than silenced with --loglevel,
      # because the flag that hides somebody else's noise hides ours too.
      - name: Package the extension
        working-directory: src/Phenome.Apps.VSCodeLink
        run: npx --yes @vscode/vsce@3.9.2 package --allow-missing-repository --skip-license

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-ChildItem -Recurse src/Phenome.Apps.GrasshopperLink/bin/Release -Filter *.gha)[0].FullName dist
          Copy-Item (Get-ChildItem -Recurse src/Phenome.Apps.RhinoLink/bin/Release -Filter *.rhp)[0].FullName dist
          Copy-Item src/Phenome.Apps.GrasshopperLink/manifest.yml dist
          Copy-Item (Get-ChildItem src/Phenome.Apps.VSCodeLink -Filter 'phenome-link-*.vsix')[0].FullName dist
          Get-ChildItem dist | ForEach-Object { "  $($_.Name)  $([int]($_.Length/1KB)) KB" }

      # All five version declarations must agree. Yak cross-checks the first two, the friction log stamps its
      # reports with the assembly version so a report names a build - and the extension is here because it was
      # not: v0.1.0 shipped a 0.17.0 vsix, two histories in one release, and nothing complained. The parts
      # only work together, so they carry one number.
      #
      # The Rhino plugin joined this list the moment it existed. A check that names its subjects one by one
      # has to be extended by hand every time there is a new one, and the failure is silent: an unnamed
      # project simply is not checked, and ships with whatever number it happened to have.
      - name: Check every version declaration agrees
        shell: pwsh
        run: |
          $versions = [ordered]@{
            'manifest.yml' = (Get-Content src/Phenome.Apps.GrasshopperLink/manifest.yml |
              Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
            'csproj' = (Select-Xml -Path src/Phenome.Apps.GrasshopperLink/Phenome.Apps.GrasshopperLink.csproj `
              -XPath '//Version').Node.InnerText.Trim()
            'rhino csproj' = (Select-Xml -Path src/Phenome.Apps.RhinoLink/Phenome.Apps.RhinoLink.csproj `
              -XPath '//Version').Node.InnerText.Trim()
            'package.json' = (Get-Content src/Phenome.Apps.VSCodeLink/package.json -Raw | ConvertFrom-Json).version.Trim()
            'mcp.js' = (Get-Content src/Phenome.Apps.VSCodeLink/mcp.js |
              Select-String "name: 'grasshopper', version: '(.+?)'").Matches.Groups[1].Value.Trim()
          }
          $versions.GetEnumerator() | ForEach-Object { "  $($_.Key): $($_.Value)" }

          # @() around it on purpose: Sort-Object -Unique hands back a bare string when everything agrees,
          # and indexing a string gives a character - so $distinct[0] was '0' rather than '0.18.0', and the
          # check failed precisely when it should have passed.
          $distinct = @($versions.Values | Sort-Object -Unique)
          if ($distinct.Count -ne 1) { throw "the versions disagree: $($distinct -join ', ')" }

          # On a tag, the tag is a fourth declaration and the loudest one - it is what the release is named
          # after and what anybody quotes in a bug report.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
            "  tag: $tag"
            if ($tag -ne $distinct[0]) { throw "the tag says $tag and the files say $($distinct[0])" }
          }

          # And the changelog, for the same reason the versions are checked here rather than trusted: it is
          # the only account of a release written for somebody who does not have this repository, and a
          # release that forgot to write one looks exactly like a release with nothing worth saying.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($distinct[0]))$" -Quiet)) {
            throw "CHANGELOG.md has no '## $($distinct[0])' entry"
          }
          "  changelog: an entry for $($distinct[0])"

      - uses: actions/upload-artifact@v4
        with:
          name: phenome-link
          path: dist/*

  # The Yak package, which needs Yak.exe - it ships inside Rhino and no hosted runner has one. A self-hosted
  # runner on a machine with Rhino does, so this is the step that turns having one into something.
  #
  # Gated on a repository variable rather than on a label, because a job asking for a runner that does not
  # exist queues for six hours and then fails. Set PHENOME_SELF_HOSTED to 'true' once a Windows runner with
  # Rhino is registered; until then this skips and the release carries the loose files, which is enough
  # to install by hand.
  #
  # Tags only, and that is a security boundary rather than a convenience. This repository is public, so
  # letting an organisation runner serve it means somebody else's pull request could run on our machine.
  # A tag can only be pushed by somebody with write access; a fork's pull request never is one. Everything a
  # stranger can trigger stays on GitHub's hosted runners, where it belongs.
  yak:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PHENOME_SELF_HOSTED == 'true'
    runs-on: [self-hosted, windows]

    steps:
      # A self-hosted runner does not get a clean workspace the way a hosted one does: whatever the last run
      # left is still here. v0.18.0 shipped a .yak named 0.1.0 because the previous release's package was
      # still sitting in dist and got copied along.
      - name: Start from an empty dist
        shell: pwsh
        run: if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - uses: actions/download-artifact@v4
        with:
          name: phenome-link
          path: dist

      - name: Build the Yak package
        shell: pwsh
        run: |
          $yak = 'C:\Program Files\Rhino 8\System\Yak.exe'
          if (-not (Test-Path $yak)) { throw "Yak is not at $yak - is Rhino installed on this runner?" }

          $expected = ($env:GITHUB_REF -replace '^refs/tags/v', '')

          # Yak builds from a folder holding the .gha, its manifest and anything travelling with it. The rhp
          # and the vsix ride along so one install is the whole install: Rhino gets both plugins, and the
          # canvas's pair button hands the extension to VS Code.
          # Named extensions rather than dist/*, so a stray .yak from anywhere cannot join the staging folder
          # and then be mistaken for the one just built.
          $staging = Join-Path $env:RUNNER_TEMP 'yak'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item dist/*.gha, dist/*.rhp, dist/*.vsix, dist/manifest.yml $staging

          Push-Location $staging
          try {
            & $yak build
            if ($LASTEXITCODE -ne 0) { throw 'yak build failed' }
          }
          finally { Pop-Location }

          $packages = @(Get-ChildItem $staging -Filter '*.yak')
          if ($packages.Count -eq 0) { throw 'yak produced no package' }
          if ($packages.Count -gt 1) { throw "more than one .yak in the staging folder: $($packages.Name -join ', ')" }

          # Yak names the file from the manifest, so the name is the evidence that the right manifest was
          # used. Checked rather than assumed, because the wrong one is not obvious until somebody installs it.
          $package = $packages[0]
          if ($package.Name -notlike "*-$expected-*") {
            throw "yak built $($package.Name), which is not version $expected"
          }

          Copy-Item $package.FullName dist
          "  $($package.Name)  $([int]($package.Length/1KB)) KB"

      - uses: actions/upload-artifact@v4
        with:
          name: phenome-link-yak
          path: dist/*.yak

  # The same three files into the company SharePoint library, so an internal machine can pick up a build
  # without going to a public release page - and so there is a record of every version we cut.
  #
  # Hosted rather than self-hosted, deliberately. Graph is ordinary HTTPS and nothing here is local, so this
  # needs no runner of ours: one fewer thing depending on one machine, and the publishing secret never lands
  # on a machine that already holds another. Tag-only, so a fork's pull request never reaches the secret -
  # GitHub withholds secrets from fork pull requests anyway, and the two together are the belt and braces.
  sharepoint:
    needs: [build, yak]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phenome-link
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phenome-link-yak
          path: dist

      - name: Upload to the Builds folder
        shell: pwsh
        env:
          # These live in Settings → Secrets and variables → **Actions**. There is an Agents tab beside it
          # holding a separate store with the same names and the same look, which workflows cannot read -
          # v0.19.0 published nothing because that is where they had been created, and the step reported
          # them missing because to a workflow they were.
          TENANT: ${{ vars.PHENOME_GRAPH_TENANT }}
          CLIENT_ID: ${{ vars.PHENOME_GRAPH_CLIENT_ID }}
          SECRET: ${{ secrets.PHENOME_GRAPH_SECRET }}
          DRIVE: ${{ vars.PHENOME_PUBLISH_DRIVE }}
          FOLDER: ${{ vars.PHENOME_LINK_FOLDER }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          $missing = @('TENANT','CLIENT_ID','SECRET','DRIVE','FOLDER') |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing) {
            # Not a failure: the release itself is the product, and this is a convenience on top of it. But
            # it says so, because a step that publishes nothing and prints nothing cannot be told from one
            # that worked.
            Write-Host "  $($missing -join ', ') not set - nothing sent to SharePoint."
            exit 0
          }

          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''

          # A folder per version, because the .gha carries no version in its filename and would otherwise
          # overwrite its predecessor on every release - leaving a file nobody can date.
          $target = "$env:FOLDER/$version"

          $files = Get-ChildItem dist -Include *.gha, *.vsix, *.yak -Recurse
          if (-not $files) { throw 'nothing to upload' }

          $token = (Invoke-RestMethod -Method POST `
            -Uri "https://login.microsoftonline.com/$env:TENANT/oauth2/v2.0/token" -Body @{
              client_id = $env:CLIENT_ID; client_secret = $env:SECRET
              scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials'
            }).access_token
          $headers = @{ Authorization = "Bearer $token" }

          foreach ($f in $files) {
            $uri = "https://graph.microsoft.com/v1.0/drives/$env:DRIVE/root:/$target/$($f.Name)`:/content"
            $up = Invoke-RestMethod -Method PUT -Headers $headers -ContentType 'application/octet-stream' `
              -InFile $f.FullName -Uri $uri
            Write-Host "  $($up.name) -> $target, $([int]($up.size/1KB)) KB"
          }

          if (-not $env:TEAMS_WEBHOOK) { Write-Host '  TEAMS_WEBHOOK is not set - nobody notified'; exit 0 }

          $body = @{
            type = 'message'
            attachments = @(@{
              contentType = 'application/vnd.microsoft.card.adaptive'
              content = @{
                '$schema' = 'http://adaptivecards.io/schemas/adaptive-card.json'
                type = 'AdaptiveCard'; version = '1.5'
                body = @(@{
                  type = 'TextBlock'; wrap = $true
                  text = "**Phenome Link $version** published. $($files.Count) files in ``Builds/$target``, " +
                         "and a [release]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/v$version)."
                })
              }
            })
          } | ConvertTo-Json -Depth 10

          try {
            Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -ContentType 'application/json' -Body $body | Out-Null
            Write-Host '  notified Teams'
          }
          catch { Write-Host "  Teams refused the message: $($_.Exception.Message)" }

  release:
    # The yak job is skipped when no self-hosted runner is configured, and a skipped dependency would take the
    # release with it. always() keeps the release going and the download below tolerates the missing artifact.
    needs: [build, yak]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phenome-link
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phenome-link-yak
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          # Named rather than dist/*, because that also published manifest.yml - a build input, and one more
          # file to wonder about on a page where every entry should be something you install.
          files: |
            dist/*.yak
            dist/*.gha
            dist/*.rhp
            dist/*.vsix
          body: |
            Three parts of one mechanism, and they install by hand. There is no package server behind this
            and no plan for one; `tools/pack-yak.ps1` builds a `.yak` for your own folder source if you want
            one. A `.yak` is attached below only when the machine that built this release had Rhino on it —
            do not count on it, the three files are always here.

            **The .gha** goes in `%APPDATA%\Grasshopper\Libraries\`. Then right-click it, Properties,
            **Unblock** — Windows marks files that arrived from elsewhere and Grasshopper refuses a blocked
            assembly *silently*. This is the step everybody misses.

            **The .rhp**: drag it onto an open Rhino, or point `PlugInManager` at it. Rhino remembers what
            it has loaded between sessions — but it writes that list when it *closes normally*, so a Rhino
            killed rather than closed forgets it was ever told.

            **The .vsix**: `code --install-extension phenome-link-<version>.vsix`, or let the canvas's
            *Pair with VS Code* button do it on the first pairing.

            Then restart Rhino. `GET /` on the port in `%TEMP%\phenome-link-<pid>.port` describes the canvas
            protocol, and `%TEMP%\phenome-rhino-<pid>.port` the one that still answers when the canvas
            cannot — whether Rhino is free, what dialog is holding it, and how to answer that.

            What changed since the version you have is in `CHANGELOG.md`, which is written for that question
            rather than for the commit history.
