# Builds both halves of the link and, from a tag, attaches them to a release.
#
# This is the replacement for `yak push`: a tagged release carrying the .gha and the .vsix, which anybody can
# download without a package source, a token or an account. Yak packing stays a local script because it needs
# Yak.exe, which ships inside Rhino and is not on a runner.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows, because the plugin targets net7.0 against the Grasshopper reference assemblies and that is where
    # the .gha is normally produced. Nothing here needs Rhino installed - the NuGet package supplies the
    # references - but keeping the build on the platform it ships to costs nothing and removes a question.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The plugin references no Phenome library on purpose, so this builds from a clean clone with no feed
      # and no secret. That property is worth a comment because it is the reason this repository is public.
      - name: Build the plugin
        run: dotnet build src/Phenome.Apps.GrasshopperLink/Phenome.Apps.GrasshopperLink.csproj -c Release

      - name: Package the extension
        working-directory: src/Phenome.Apps.VSCodeLink
        run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-ChildItem -Recurse src/Phenome.Apps.GrasshopperLink/bin/Release -Filter *.gha)[0].FullName dist
          Copy-Item src/Phenome.Apps.GrasshopperLink/manifest.yml dist
          Copy-Item (Get-ChildItem src/Phenome.Apps.VSCodeLink -Filter 'phenome-link-*.vsix')[0].FullName dist
          Get-ChildItem dist | ForEach-Object { "  $($_.Name)  $([int]($_.Length/1KB)) KB" }

      # All four version declarations must agree. Yak cross-checks the first two, the friction log stamps its
      # reports with the assembly version so a report names a build - and the extension is here because it was
      # not: v0.1.0 shipped a 0.17.0 vsix, two histories in one release, and nothing complained. The halves
      # only work as a pair, so they carry one number.
      - name: Check every version declaration agrees
        shell: pwsh
        run: |
          $versions = [ordered]@{
            'manifest.yml' = (Get-Content src/Phenome.Apps.GrasshopperLink/manifest.yml |
              Select-String '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
            'csproj' = (Select-Xml -Path src/Phenome.Apps.GrasshopperLink/Phenome.Apps.GrasshopperLink.csproj `
              -XPath '//Version').Node.InnerText.Trim()
            'package.json' = (Get-Content src/Phenome.Apps.VSCodeLink/package.json -Raw | ConvertFrom-Json).version.Trim()
          }
          $versions.GetEnumerator() | ForEach-Object { "  $($_.Key): $($_.Value)" }

          # @() around it on purpose: Sort-Object -Unique hands back a bare string when everything agrees,
          # and indexing a string gives a character - so $distinct[0] was '0' rather than '0.18.0', and the
          # check failed precisely when it should have passed.
          $distinct = @($versions.Values | Sort-Object -Unique)
          if ($distinct.Count -ne 1) { throw "the versions disagree: $($distinct -join ', ')" }

          # On a tag, the tag is a fourth declaration and the loudest one - it is what the release is named
          # after and what anybody quotes in a bug report.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
            "  tag: $tag"
            if ($tag -ne $distinct[0]) { throw "the tag says $tag and the files say $($distinct[0])" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: phenome-link
          path: dist/*

  # The Yak package, which needs Yak.exe - it ships inside Rhino and no hosted runner has one. A self-hosted
  # runner on a machine with Rhino does, so this is the step that turns having one into something.
  #
  # Gated on a repository variable rather than on a label, because a job asking for a runner that does not
  # exist queues for six hours and then fails. Set PHENOME_SELF_HOSTED to 'true' once a Windows runner with
  # Rhino is registered; until then this skips and the release carries the .gha and the .vsix, which is enough
  # to install by hand.
  #
  # Tags only, and that is a security boundary rather than a convenience. This repository is public, so
  # letting an organisation runner serve it means somebody else's pull request could run on our machine.
  # A tag can only be pushed by somebody with write access; a fork's pull request never is one. Everything a
  # stranger can trigger stays on GitHub's hosted runners, where it belongs.
  yak:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PHENOME_SELF_HOSTED == 'true'
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phenome-link
          path: dist

      - name: Build the Yak package
        shell: pwsh
        run: |
          $yak = 'C:\Program Files\Rhino 8\System\Yak.exe'
          if (-not (Test-Path $yak)) { throw "Yak is not at $yak - is Rhino installed on this runner?" }

          # Yak builds from a folder holding the .gha, its manifest and anything travelling with it. The vsix
          # rides along so one install is the whole install: the canvas's pair button hands it to VS Code.
          $staging = Join-Path $env:RUNNER_TEMP 'yak'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item dist/* $staging

          Push-Location $staging
          try {
            & $yak build
            if ($LASTEXITCODE -ne 0) { throw 'yak build failed' }
          }
          finally { Pop-Location }

          $package = Get-ChildItem $staging -Filter '*.yak' | Select-Object -First 1
          if (-not $package) { throw 'yak produced no package' }
          Copy-Item $package.FullName dist
          "  $($package.Name)  $([int]($package.Length/1KB)) KB"

      - uses: actions/upload-artifact@v4
        with:
          name: phenome-link-yak
          path: dist/*.yak

  release:
    # The yak job is skipped when no self-hosted runner is configured, and a skipped dependency would take the
    # release with it. always() keeps the release going and the download below tolerates the missing artifact.
    needs: [build, yak]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phenome-link
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phenome-link-yak
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          # Named rather than dist/*, because that also published manifest.yml - a build input, and one more
          # file to wonder about on a page where every entry should be something you install.
          files: |
            dist/*.yak
            dist/*.gha
            dist/*.vsix
          body: |
            Both halves, and they only work as a pair.

            **The .gha** goes in `%APPDATA%\Grasshopper\Libraries\`. Then right-click it, Properties,
            **Unblock** — Windows marks files that arrived from elsewhere and Grasshopper refuses a blocked
            assembly *silently*. This is the step everybody misses.

            **The .vsix**: `code --install-extension phenome-link-<version>.vsix`, or let the canvas's
            *Pair with VS Code* button do it on the first pairing.

            Then restart Rhino. `GET /` on the port in `%TEMP%\phenome-link-<pid>.port` describes the whole
            protocol.
